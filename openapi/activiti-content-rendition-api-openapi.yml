openapi: 3.2.0
info:
  title: Activiti Public Rest Content Rendition API
  description: The Alfresco Activiti BPM Suite comes with a REST API.
  version: 1.4.0
  contact:
    name: Activiti Community
    url: https://www.activiti.org/
    email: activiti-community@alfresco.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://{host}/activiti-app
  description: Activiti BPM Server
  variables:
    host:
      default: localhost:8080
      description: The Activiti server host
security:
- basicAuth: []
tags:
- name: Content Rendition
  description: Retrieve Content Rendition
paths:
  /api/enterprise/content/{contentId}/rendition/{renditionType}:
    get:
      tags:
      - Content Rendition
      summary: Retrieve Raw Content
      operationId: getRawContentUsingGET_2
      parameters:
      - name: contentId
        in: path
        description: contentId
        required: true
        schema:
          type: integer
          format: int64
      - name: renditionType
        in: path
        description: renditionType
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication using valid Activiti user credentials
