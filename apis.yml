apis:
- name: Activiti Cloud Runtime Bundle API
  description: >-
    The Activiti Cloud Runtime Bundle provides a cloud-native REST API for executing BPMN 2.0 processes
    in a distributed, scalable environment. It exposes endpoints for process instances, tasks, variables,
    and integration with cloud connectors. Requires the ACTIVITI_USER role for interaction via the TaskRuntime
    API.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
